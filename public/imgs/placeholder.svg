<svg width="400" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="800" fill="#0d0d1a"/>
  
  <!-- Top bar -->
  <rect width="400" height="60" fill="#1a1a2e"/>
  <text x="200" y="35" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">
    👋 Good evening, XHub
  </text>
  
  <!-- Quote section -->
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="bold">
    The internet has no rules.
  </text>
  <text x="200" y="230" font-family="Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle">
    Make your own.
  </text>
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="12" fill="#FF6B6B" text-anchor="middle" letter-spacing="2">
    QUOTE OF THE DAY
  </text>
  
  <!-- Stats -->
  <rect x="50" y="300" width="120" height="40" rx="20" fill="#2a2a3e"/>
  <text x="110" y="325" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">
    📚 6 saved
  </text>
  
  <rect x="180" y="300" width="140" height="40" rx="20" fill="#2a2a3e"/>
  <text x="250" y="325" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">
    ⬇️ 1 download
  </text>
  
  <!-- Quick Access -->
  <text x="50" y="400" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="bold">
    Quick Access
  </text>
  <text x="50" y="425" font-family="Arial, sans-serif" font-size="14" fill="#888888">
    Your favourite sites
  </text>
  
  <text x="50" y="465" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">
    FREE ONLYFANS
  </text>
  
  <!-- App Icons -->
  <rect x="50" y="490" width="70" height="70" rx="15" fill="url(#grad1)"/>
  <text x="85" y="535" font-family="Arial, sans-serif" font-size="32" fill="#ffffff" text-anchor="middle">P</text>
  
  <rect x="130" y="490" width="70" height="70" rx="15" fill="#FF6B35"/>
  <text x="165" y="535" font-family="Arial, sans-serif" font-size="32" fill="#ffffff" text-anchor="middle">K</text>
  
  <rect x="210" y="490" width="70" height="70" rx="15" fill="#4ECDC4"/>
  <text x="245" y="535" font-family="Arial, sans-serif" font-size="32" fill="#ffffff" text-anchor="middle">6</text>
  
  <rect x="290" y="490" width="70" height="70" rx="15" fill="#5D5FEF"/>
  <text x="325" y="535" font-family="Arial, sans-serif" font-size="32" fill="#ffffff" text-anchor="middle">U</text>
  
  <!-- Downloads section -->
  <text x="50" y="620" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="bold">
    Downloads
  </text>
  <text x="50" y="645" font-family="Arial, sans-serif" font-size="14" fill="#888888">
    1 download • 221 MB total
  </text>
  
  <!-- Bottom buttons -->
  <text x="70" y="700" font-family="Arial, sans-serif" font-size="14" fill="#22D3EE" font-weight="bold">
    Clean up
  </text>
  <text x="200" y="700" font-family="Arial, sans-serif" font-size="14" fill="#22D3EE" font-weight="bold">
    Remove all
  </text>
  <text x="310" y="700" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">
    Delete all
  </text>
  
  <!-- Bottom nav bar -->
  <rect y="740" width="400" height="60" fill="#1a1a2e" rx="20"/>
</svg>
