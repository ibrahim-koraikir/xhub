  <style>
    :root {
      --bg: #0A0A0F;
      --surface: #12121C;
      --surface-2: #1A1A28;
      --border: rgba(255, 255, 255, 0.07);
      --border-strong: rgba(255, 255, 255, 0.12);
      --text-primary: #F1F0FF;
      --text-secondary: #8B8AA8;
      --violet: #7C3AED;
      --violet-light: #A78BFA;
      --violet-glow: rgba(124, 58, 237, 0.25);
      --cyan: #22D3EE;
      --cyan-glow: rgba(34, 211, 238, 0.2);
      --coral: #F43F5E;
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--bg);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--violet); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--violet-light); }

    /* Hide scrollbar for horizontal scroll */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Glass panel */
    .glass-panel {
      background: rgba(18, 18, 28, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
    }

    /* Neon glow utilities */
    .glow-violet { box-shadow: 0 0 40px var(--violet-glow), 0 0 80px rgba(124,58,237,0.1); }
    .glow-cyan   { box-shadow: 0 0 40px var(--cyan-glow); }

    /* Display font */
    .font-display { font-family: 'Space Grotesk', sans-serif; }

    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, var(--violet-light) 0%, var(--cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Accessibility Focus outlines */
    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 4px;
    }

    /* Motion reduction support */
    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto !important;
      }
      .animate-float,
      .animate-marquee-up,
      .animate-marquee-down,
      .animate-pulse-glow,
      .animate-pulse-slow {
        animation: none !important;
        transform: none !important;
      }
      /* Keep background static and clean */
      .animate-marquee-up img,
      .animate-marquee-down img {
        transform: none !important;
      }
      * {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }

    /* Noise texture overlay for depth */
    .noise::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      border-radius: inherit;
    }
  </style>
