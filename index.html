    html {

    /* Custom scrollbar */

    ::-webkit-scrollbar-track { background: #07070B; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #f97316, #ef4444); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #fb923c; }

    /* Hide scrollbar for horizontal scroll */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Glass panel */
    .glass-panel {
      background: rgba(14, 14, 23, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
    }

    .glass-panel-glow {
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.05) 0%, rgba(239, 68, 68, 0.02) 100%);

    /* Display font */
    .font-display { font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; }

    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #FF8C38 0%, #FF3D3D 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .gradient-gold {
      background: linear-gradient(135deg, #FBBF24 0%, #F97316 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Accessibility Focus outlines */
    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--violet);
      outline-offset: 4px;
    }

    @keyframes shimmer-sweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    .animate-shimmer-sweep {
      animation: shimmer-sweep 3s ease-in-out infinite;
    }

    /* Motion reduction support */
    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto !important;
      }
      .animate-float,
      .animate-marquee-up,
      .animate-marquee-down,
      .animate-pulse-glow,
      .animate-pulse-slow {
        animation: none !important;
        transform: none !important;
      }
      .animate-marquee-up img,
      .animate-marquee-down img {
        transform: none !important;
      }
      * {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;

    /* Noise texture overlay for depth */
